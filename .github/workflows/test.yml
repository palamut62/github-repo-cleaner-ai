name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Tests only need Node + git; skip downloading the Electron binary.
      - run: npm ci --ignore-scripts

      - run: npm test

      - name: Syntax check
        run: node --check main.js && node --check preload.js
